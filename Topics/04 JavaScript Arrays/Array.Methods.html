<script>

// Push
const cart = ['apple', 'orange'];
cart.push('pear', 3 , 4); 
console.log(cart); // ['apple', 'orange', 'pear', 3, 4]


// Pop
const fruits = ["apple", "orange", "banana"];
const fruit = fruits.pop(); // 'banana'
console.log(fruits); // ["apple", "orange"]


// Shift
let cats = ['Bob', 'Willy', 'Mini']; 
cats.shift(); // ['Willy', 'Mini']





</script>
